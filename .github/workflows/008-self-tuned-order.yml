name: 008 self-tuned order memory
on:
  push:
    paths:
      - "experiments/008_self_tuned_order/**"
      - "workflows/008_*.json"
      - "tests/test_008_self_tuned_order.py"
      - ".github/workflows/008-self-tuned-order.yml"
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: anttiluode/PerceptionLab
          path: PerceptionLab
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy opencv-python-headless
      - run: python -m unittest discover -s tests -p test_008_self_tuned_order.py -v
      - run: python experiments/008_self_tuned_order/run.py --upstream PerceptionLab --out results/008_ci_rerun.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 008-self-tuned-order
          path: results/008_ci_rerun.json
