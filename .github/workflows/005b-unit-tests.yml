name: 005b three-active workflow regression
on:
  push:
    paths:
      - "tests/test_005b_three_active.py"
      - "workflows/005_ABC093_*.json"
      - ".github/workflows/005b-unit-tests.yml"
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: anttiluode/PerceptionLab
          path: PerceptionLab
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy opencv-python-headless
      - run: python -m unittest discover -s tests -p test_005b_three_active.py -v
