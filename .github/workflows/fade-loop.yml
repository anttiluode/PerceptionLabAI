name: Experiment 003 fading-history field feedback
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  headless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: anttiluode/PerceptionLab
          path: PerceptionLab
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy opencv-python-headless
      - run: python -m unittest discover -s tests -v
      - run: python experiments/003_fade_closed_loop/run.py --upstream PerceptionLab --steps 550
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fade-loop-003-receipt
          path: results/003_fade_closed_loop.json
