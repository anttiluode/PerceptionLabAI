name: 011 two independent histories / retention vs learning
on:
  push:
    paths:
      - "experiments/011_dual_history/**"
      - "tests/test_011_dual_history.py"
      - ".github/workflows/011-dual-history.yml"
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: anttiluode/PerceptionLab
          path: PerceptionLab
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy opencv-python-headless
      - run: python -m unittest discover -s tests -p test_011_dual_history.py -v
      - run: python experiments/011_dual_history/run.py --upstream PerceptionLab --workers 2 --smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 011-preflight-smoke-NOT-study-results
          path: results/011_dual_history_smoke.json
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: anttiluode/PerceptionLab
          path: PerceptionLab
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy opencv-python-headless
      - run: python experiments/011_dual_history/run.py --upstream PerceptionLab --workers 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 011-independent-dual-history-full
          path: results/011_dual_history.json
