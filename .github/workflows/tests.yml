name: Verify causal age experiment
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: anttiluode/PerceptionLab
          path: PerceptionLab
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy opencv-python-headless
      - run: python -m unittest discover -s tests -v
      - run: python experiments/001_causal_age/run.py --upstream PerceptionLab
      - uses: actions/upload-artifact@v4
        with:
          name: causal-age-receipt
          path: results/001_causal_age.json
