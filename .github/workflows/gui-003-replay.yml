name: GUI-style saved graph replay (WaveField size fix)
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: anttiluode/PerceptionLab
          ref: ai/fix-wavefield-saved-size
          path: PerceptionLab
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy opencv-python-headless
      - run: python -m unittest discover -s tests -p test_graph003_host_replay.py -v
