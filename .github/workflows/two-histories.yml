name: Experiment 004 two fading histories
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: anttiluode/PerceptionLab
          path: PerceptionLab
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy opencv-python-headless
      - run: python -m unittest discover -s tests -p 'test_004_two_histories.py' -v
      - run: python experiments/004_two_histories/run.py --upstream PerceptionLab --steps 650
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experiment-004-two-histories
          path: results/004_two_histories.json
